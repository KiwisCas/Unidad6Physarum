name: Deploy Physarum to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "index.html"
            "main.js"
            "shaders.js"
            "whale.glb"
            "assets/music/Vocals.mp3"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required file is missing"
              exit 1
            fi
          done

      - name: Check local asset references
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "./whale.glb" main.js
          grep -Fq "./assets/music/Vocals.mp3" main.js
          grep -Fq "./assets/" main.js
          find assets -maxdepth 1 -type f -iname '*.wav' -print -quit | grep -q .

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
